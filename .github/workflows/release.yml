name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release draft
    runs-on: ubuntu-latest
    env:
      APP_NAME: ddm-sync
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure requested tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cargo \
            debhelper-compat \
            pkg-config \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qml-module-qtquick-controls2 \
            rustc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Debian package
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          dpkg-buildpackage -us -uc -b

          shopt -s nullglob
          packages=(../"${APP_NAME}"_*.deb)
          test "${#packages[@]}" -eq 1

          mkdir -p dist
          cp "${packages[0]}" dist/

          package_root="$(mktemp -d)"
          dpkg-deb --extract "${packages[0]}" "${package_root}"
          install -Dm755 \
            "${package_root}/usr/lib/${APP_NAME}/${APP_NAME}" \
            "dist/${APP_NAME}"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: |
            dist/${{ env.APP_NAME }}
            dist/*.deb
