name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release draft
    runs-on: ubuntu-latest
    env:
      APP_NAME: ddm-sync
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git rev-parse --verify "refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qml-module-qtquick-controls2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package artifact
        run: |
          mkdir -p "dist/${APP_NAME}-${RELEASE_TAG}-linux-x86_64"
          cp "target/release/${APP_NAME}" "dist/${APP_NAME}-${RELEASE_TAG}-linux-x86_64/"
          cp -R qml "dist/${APP_NAME}-${RELEASE_TAG}-linux-x86_64/"
          cp README.md LICENSE "dist/${APP_NAME}-${RELEASE_TAG}-linux-x86_64/"
          tar -C dist -czf "dist/${APP_NAME}-${RELEASE_TAG}-linux-x86_64.tar.gz" "${APP_NAME}-${RELEASE_TAG}-linux-x86_64"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: dist/*.tar.gz
